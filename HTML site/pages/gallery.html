<!DOCTYPE html>
<html>
<head>
    <title>
        Собачі Фото
    </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p class="gallery"> Тицяй на крапки та дивись різні фото</p>
    <div class="gallery">
        <input type="radio" id="image1" name="gallery" checked>
        <input type="radio" id="image2" name="gallery">
        <input type="radio" id="image3" name="gallery">
        <input type="radio" id="image4" name="gallery">
        <div class="controls">
            <label for="image1"></label>
            <label for="image2"></label>
            <label for="image3"></label>
            <label for="image4"></label>
          </div>
        
      
        <div class="imageMain">
          <div class="image" id="img1">
            <p>Тут я маленький сплю</p>
            <img src="photo/sleep.jpg" alt="собака спить">
          </div>
          <div class="image" id="img2">
            <p>А тут мені сумно</p>
            <img src="photo/bored.jpg" alt="собаці сумно">
          </div>
          <div class="image" id="img3">
            <p>Випитую у господарів щось смачне</p>
            <img src="photo/shy.jpg" alt="Собака просить смаколик">
          </div>
          <div class="image" id="img4">
            <p>Мені щось не подобається, вже не пам'ятаю що саме</p>
            <img src="photo/suspicious.jpg" alt="Собаці щось не подобається">
          </div>
        </div>
      
        
      </div>
